<h2 class="titulo-musk">Achievements & Certificates</h2>
<ul style="list-style-type: none; padding: 0;">
  <li *ngFor="let cert of certificatesList" style="margin-bottom: 24px;">
    <strong style="font-size: 15px;">{{cert.title}} ({{cert.year}})</strong> <br>
    <small>{{cert.Description}}</small>
    
    <!-- Aquí cambiamos la imagen por un link -->
    <div *ngIf="cert.imagenUrl" style="margin-top: 8px;">
      <a 
        [href]="cert.imagenUrl" 
        target="_blank" 
        rel="noopener noreferrer" 
        style="color: #007bff; text-decoration: none; font-weight: bold; font-size: 14px;"
      >
        Ver Certificado 🔗
      </a>
    </div>
  </li>
</ul>
