<h2 class="titulo-musk">Skills & Competences</h2>
<div *ngFor="let skill of skillsList" style="display: flex; align-items: center; margin-bottom: 12px;">
  
  <!-- Nombre de la habilidad -->
  <div style="flex: 0 0 45%; font-size: 12px; font-weight: bold; text-align: right; padding-right: 15px; color: #333;">
    {{skill.name}}
  </div>
  
  <!-- Barra de progreso con borde azul -->
  <div style="flex: 1; height: 12px; border: 1px solid #1a73e8; background-color: white; position: relative;">
    <div [style.width.%]="skill.percentaje" style="background-color: #1a73e8; height: 100%; position: absolute; top: 0; left: 0;"></div>
  </div>
</div>
