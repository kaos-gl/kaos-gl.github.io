<h2 class="titulo-musk">Skills & Competences</h2>
<ul style="list-style-type: none; padding: 0;">
  <li *ngFor="let skill of skillsList" style="margin-bottom: 15px;">
    <!-- Texto de la habilidad y porcentaje -->
    <div style="font-size: 14px; font-weight: bold; text-align: left; margin-bottom: 5px;">
      {{skill.name}} <span style="float: right;">{{skill.percentaje}}%</span>
    </div>
    <!-- Barra de progreso azul -->
    <div style="background-color: #eaeaea; width: 100%; height: 8px; border-radius: 4px; overflow: hidden;">
      <div [style.width.%]="skill.percentaje" style="background-color: #1a73e8; height: 100%;"></div>
    </div>
  </li>
</ul>
