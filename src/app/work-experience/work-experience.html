<h2 class="titulo-musk">Work Experience</h2>
<ul style="list-style-type: none; padding: 0; margin-bottom: 25px;">
  <li *ngFor="let job of workExperienceList" style="margin-bottom: 20px;">
    <div class="musk-fecha">{{ job.startDate }} - {{ job.endDate }}</div>
    <div class="musk-puesto">{{ job.position }}</div>
    <div class="musk-empresa">{{ job.company }} <span style="font-weight: normal; font-style: italic; color: #888;">| {{job.location}}</span></div>
    <p style="margin-top: 5px; font-size: 14px; line-height: 1.5;">{{ job.accomplishments }}</p>
  </li>
</ul>
