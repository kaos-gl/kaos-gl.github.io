<table style="width: 100%; margin-bottom: 20px;">
  <tr>
    <td style="width: 33%; text-align: left; vertical-align: middle;">
      <h1 style="font-size: 32px; font-weight: bold; margin: 0;">{{header.name}}</h1>
      <p style="font-style: italic; margin-top: 5px;">{{header.goalLife}}</p>
    </td>
    <td style="width: 33%; text-align: center; vertical-align: middle;">
      <img *ngIf="header.photoURL" src="{{header.photoURL}}" width="150" height="150" style="border-radius: 50%; object-fit: cover; border: 2px solid black;">
    </td>
    <td style="width: 33%; text-align: right; vertical-align: middle; line-height: 1.6;">
      Email: {{header.email}} <br>
      Tel: {{header.phoneNumber}} <br>
      Ubicación: {{header.location}} <br>
      Redes: {{header.socialNetwork}}
    </td>
  </tr>
</table>
